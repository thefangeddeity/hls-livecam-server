[package]
name = "hls-livecam-win"
version = "0.1.0"
edition = "2021"
description = "Native Windows camera node for hls-livecam-server (control-plane + web assets)"
license = "GPL-3.0"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
