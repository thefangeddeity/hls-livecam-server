[package]
name = "hls-livecam-win"
version = "0.1.0"
edition = "2021"
description = "Native Windows camera node for hls-livecam-server (control-plane, web assets, capture pipeline)"
license = "GPL-3.0"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "io-util"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
sysinfo = "0.33"
tray-icon = "0.19"
# Already in the tree transitively via axum -- pinned as a direct dep for
# the cams.json entry manager (run-6 IP manager), which round-trips the
# fleet roster as JSON and must preserve any fields the manager doesn't
# itself edit (pinned, stream_path, ...).
serde_json = "1"

[build-dependencies]
embed-manifest = "1"

[profile.release]
# run 3 adds a real-time immediate-mode GUI + per-frame video texture
# upload; size-optimized codegen (the old "z") measurably hurt redraw and
# decode throughput. lto/strip still shrink the binary without that cost.
opt-level = 3
lto = true
strip = true
