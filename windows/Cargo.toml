[package]
name = "hls-livecam-win"
# One product version across the fleet (ron): the nodes are functionally
# equivalent, so the .deb, .dmg and .msi all carry the release version
# rather than each platform keeping its own line. This feeds the MSI
# filename, the installer's ProductVersion, and the viewer's
# windows-v<version> build label via CARGO_PKG_VERSION.
version = "7.0.0"
edition = "2021"
description = "Native Windows camera node for hls-livecam-server (control-plane, web assets, capture pipeline)"
license = "GPL-3.0"

# The shipped executable is camdash.exe -- what the fleet calls this tool on
# Linux, and what the operator actually says. ONLY the binary filename
# changes: the crate/package keeps its hls-livecam-win identity, as do the
# config dir (%APPDATA%\hls-livecam-win), the Scheduled Task name
# (renaming it would strand the old task on upgrade), the install directory,
# the window title, and the Add/Remove Programs product name.
[[bin]]
name = "camdash"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "io-util"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
sysinfo = "0.33"
tray-icon = "0.19"
# Already in the tree via eframe/winit -- used to reach the raw HWND so we
# can set the taskbar (ICON_BIG) icon ourselves; eframe's with_icon only
# sets the title-bar (ICON_SMALL) one.
raw-window-handle = "0.6"
# Already in the tree transitively via axum -- pinned as a direct dep for
# the cams.json entry manager (run-6 IP manager), which round-trips the
# fleet roster as JSON and must preserve any fields the manager doesn't
# itself edit (pinned, stream_path, ...).
serde_json = "1"
# Two-way talk playback (talk.rs): WASAPI output for the incoming caller's
# voice. Mirrors broadcast-api's "ffmpeg -f alsa" sink -- there's no
# Windows equivalent muxer in the bundled ffmpeg build (checked: `ffmpeg
# -devices` lists zero audio output devices), so ffmpeg only decodes
# (stdout raw PCM) and cpal owns the actual device write, same
# spawn-ffmpeg-consume-raw-output shape video_preview.rs already uses.
cpal = "0.15"
# Same-origin reverse proxy for mediamtx's HLS (:8888) and WHIP/WHEP
# (:8889) -- see routes.rs's proxy module docs. Needed because this
# server is reachable over HTTPS (Tailscale serve terminates TLS on 443
# -> this process's :80); a browser blocks a plain-http fetch to another
# port from an https page as mixed content, which broke both video
# playback and two-way calls under the tailnet HTTPS URL (found live,
# 2026-09-09). No TLS feature needed -- this client only ever talks to
# 127.0.0.1.
reqwest = { version = "0.12", default-features = false, features = ["stream"] }

[build-dependencies]
embed-manifest = "1"
# Compiles the app icon (assets/icon.ico) into the exe as a Windows
# resource, so Explorer / Alt-Tab / pinned shortcuts show it on the file
# itself (the runtime window/taskbar icon is set separately, in main.rs).
winresource = "0.1"

[profile.release]
# run 3 adds a real-time immediate-mode GUI + per-frame video texture
# upload; size-optimized codegen (the old "z") measurably hurt redraw and
# decode throughput. lto/strip still shrink the binary without that cost.
opt-level = 3
lto = true
strip = true
